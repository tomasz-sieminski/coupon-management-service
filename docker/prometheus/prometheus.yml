global:
  scrape_interval: 5s

scrape_configs:
  - job_name: coupon-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - app:8080
          - app1:8080
          - app2:8080

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
