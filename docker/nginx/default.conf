# WARNING: This configuration preserves client-supplied X-Forwarded-For headers
# to allow k6 to simulate different client countries during load testing.
# Do NOT use in production — a production reverse proxy must always set
# X-Forwarded-For from $remote_addr to prevent client IP spoofing.
map $http_x_forwarded_for $client_forwarded_for {
    "" $remote_addr;
    default $http_x_forwarded_for;
}

upstream coupon_app {
    least_conn;
    server app1:8080;
    server app2:8080;
}

server {
    listen 80;

    location / {
        proxy_pass http://coupon_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $client_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
