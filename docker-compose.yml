services:
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "lc_messages=C"]
    environment:
      POSTGRES_DB: empik_coupons
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      POSTGRES_INITDB_ARGS: "--locale=C"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d empik_coupons"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - coupon-load-test

  app1:
    build: .
    ports:
      - "8081:8080"
    environment: &app-environment
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/empik_coupons
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_APPLICATION_JSON: >
        {
          "app": {
            "geoip": {
              "mode": "stub",
              "stub": {
                "country-code": "PL",
                "country-by-ip": {
                  "[203.0.113.10]": "PL",
                  "[198.51.100.20]": "DE",
                  "[192.0.2.30]": "US"
                }
              }
            },
            "web": {
              "trusted-proxies": ["172.28.0.0/16"]
            }
          }
        }
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coupon-load-test

  app2:
    build: .
    ports:
      - "8082:8080"
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coupon-load-test

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
    networks:
      - coupon-load-test

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app1
      - app2
    networks:
      - coupon-load-test

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres:5432/empik_coupons?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - coupon-load-test

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - coupon-load-test

  k6:
    image: grafana/k6:0.55.0
    profiles:
      - load-test
    environment:
      BASE_URL: http://nginx
      READINESS_URLS: http://app1:8080/actuator/health/readiness,http://app2:8080/actuator/health/readiness
      COUPON_MAX_USES: 100
    volumes:
      - ./scripts/k6:/scripts:ro
      - ./reports/k6:/reports
    command: run /scripts/redemption-race.js
    depends_on:
      - nginx
    networks:
      - coupon-load-test

networks:
  coupon-load-test:
    ipam:
      config:
        - subnet: 172.28.0.0/16
