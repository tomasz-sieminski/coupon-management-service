spring:
  application:
    name: coupon
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/empik_coupons
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=24h

resilience4j:
  retry:
    instances:
      geoIpProvider:
        max-attempts: 3
        wait-duration: 100ms

  circuitbreaker:
    instances:
      geoIpProvider:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

app:
  geoip:
    mode: external
    external:
      base-url: https://ipapi.co
      connect-timeout-ms: 500
      read-timeout-ms: 1000
    stub:
      country-code: PL

