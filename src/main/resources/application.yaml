spring:
  application:
    name: coupon
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/empik_coupons
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    cache-names: geoip
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=24h,recordStats

logging:
  charset:
    console: UTF-8
  pattern:
    level: "%5p [userId:%X{userId:-}, couponCode:%X{couponCode:-}]"

resilience4j:
  retry:
    instances:
      geoIpProvider:
        max-attempts: 3
        wait-duration: 100ms

  circuitbreaker:
    instances:
      geoIpProvider:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  web:
    # Trust X-Forwarded-For only from proxies that strip and replace this header.
    trusted-proxies: []
  geoip:
    mode: external
    external:
      base-url: https://ipwho.is
      connect-timeout-ms: 500
      read-timeout-ms: 1000
    stub:
      country-code: PL
      country-by-ip: {}

